name: Sync Documentation

on:
  schedule:
    - cron: '0 11 * * *'  # Daily at 11 AM UTC
  workflow_dispatch:     # Manual trigger

# Only one sync may run at a time, so that a manual dispatch cannot overlap the
# schedule and race on the same branch.
concurrency:
  group: sync-documentation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # The sync runs in a couple of minutes now that pages are fetched as
    # Markdown rather than rendered. Without this the job would inherit the
    # six-hour default sized for the old Playwright crawl, and a hang would
    # hold a runner for the whole of it.
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned to a full version rather than a major tag: setup-uv stopped
      # publishing moving major/minor tags as of v8, so `@v10` does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Dependencies are declared inline (PEP 723), so setup-uv's default
          # glob -- pyproject.toml, uv.lock, requirements.txt -- matches nothing
          # and its cache would never be invalidated. Key it on the scripts that
          # actually carry the dependency block.
          cache-dependency-glob: |
            sync_docs.py
            sync_changelog.py
            add_source_anchors.py

      - name: Run documentation sync
        shell: bash
        run: |
          set -o pipefail
          ./sync_docs.sh | tee /tmp/sync.log

      # The link audit is the signal that a rename upstream has stranded links,
      # so it belongs on the run page rather than buried in step output.
      - name: Report link audit
        if: always()
        shell: bash
        run: |
          {
            echo '### Link audit'
            echo '```'
            sed -n '/^Links:/,/^$/p' /tmp/sync.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # Compute the date deterministically. The changelog date must never be
      # inferred by the model (it used to guess wrong and re-generate an old
      # changelog, which broke the push).
      - name: Compute date
        if: steps.changes.outputs.has_changes == 'true'
        id: date
        run: |
          ISO=$(date -u +%Y-%m-%d)
          YYYY=$(date -u +%Y)
          MM=$(date -u +%m)
          DAY=$(date -u +%-d)
          MONTH=$(date -u +%B)
          case "$DAY" in
            1|21|31) SUFFIX=st ;;
            2|22)    SUFFIX=nd ;;
            3|23)    SUFFIX=rd ;;
            *)       SUFFIX=th ;;
          esac
          HUMAN="${MONTH} ${DAY}${SUFFIX}, ${YYYY}"
          {
            echo "iso=$ISO"
            echo "yyyy=$YYYY"
            echo "mm=$MM"
            echo "human=$HUMAN"
          } >> "$GITHUB_OUTPUT"
          echo "Computed date: $HUMAN ($ISO)"

      # The workflow owns every git commit so the branch structure is always a
      # clean fast-forward. The model only writes the changelog file.
      - name: Commit documentation changes
        if: steps.changes.outputs.has_changes == 'true'
        id: docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs-md versions
          git commit -m "Update Claude documentation for ${{ steps.date.outputs.human }}"
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Committed documentation as $SHA"

      - name: Build changelog prompt
        if: steps.changes.outputs.has_changes == 'true'
        id: prompt
        env:
          HUMAN: ${{ steps.date.outputs.human }}
          ISO: ${{ steps.date.outputs.iso }}
          YYYY: ${{ steps.date.outputs.yyyy }}
          MM: ${{ steps.date.outputs.mm }}
          DOCS_SHA: ${{ steps.docs.outputs.sha }}
        run: |
          # Extract the changelog format/instructions (content after the YAML frontmatter).
          FORMAT=$(awk 'BEGIN{p=0} /^---$/{p++; next} p>=2{print}' .claude/commands/changelog.md)
          {
            echo "content<<CHANGELOG_PROMPT_EOF"
            printf '%s\n' "You are running in an automated GitHub Actions workflow. The rules below are REQUIRED and override any conflicting instructions in the changelog format that follows."
            printf '%s\n' ""
            printf '%s\n' "1. Today's date is ${HUMAN} (${ISO}). Use exactly this date for the changelog title and filename. Do NOT infer the date from git history or file contents."
            printf '%s\n' "2. The documentation and versions changes for today have ALREADY been committed as git commit ${DOCS_SHA}. Wherever the format below shows {commit-hash}, use ${DOCS_SHA}."
            printf '%s\n' "3. Inspect the changes by running 'git show --stat ${DOCS_SHA}' and 'git show ${DOCS_SHA} -- <path>'. There are no uncommitted changes to review."
            printf '%s\n' "4. You have read-only git access. Do NOT run git add, git commit, git commit --amend, git reset, git rebase, or git push."
            printf '%s\n' "5. Your only write action is to create the changelog file at changelogs/${YYYY}/${MM}/changelog-${ISO}.md using the Write tool. Do NOT commit it; the workflow commits and pushes it for you."
            printf '%s\n' ""
            printf '%s\n' "--- Changelog format and analysis instructions ---"
            printf '%s\n' ""
            printf '%s\n' "$FORMAT"
            echo "CHANGELOG_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code for changelog
        if: steps.changes.outputs.has_changes == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.content }}
          # Read-only git only: the model must not be able to alter commit history.
          # Only Bash needs listing here. Read, Glob, Grep and TodoWrite never ask
          # for permission, so naming them would change nothing -- every denial
          # this step records is a shell command that matched no prefix below.
          #
          # The non-git entries are the text-processing companions of a diff this
          # size, each read-only by construction (`sed -n`, not `sed`) so the
          # invariant above holds no matter what gets piped into what. Write
          # creates parent directories itself, but the model tends to reach for
          # `mkdir -p` first and a denial there costs it a turn.
          #
          # The value MUST be quoted: patterns like "Bash(git show:*)" contain a
          # space, and the action tokenizes claude_args on whitespace. Without the
          # quotes the allowlist is split into garbage ("Bash(git", "show:*)", ...)
          # and the model loses all git access.
          claude_args: |
            --allowedTools "Read,Write,Bash(git show:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(find:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(tr:*),Bash(diff:*),Bash(sed -n:*),Bash(basename:*),Bash(dirname:*),Bash(echo:*),Bash(mkdir -p:*)"

      # The action hides Claude's output ("full output hidden for security"),
      # so a run that ends without writing the changelog leaves nothing behind to
      # explain itself -- only a warning that the file is missing. The execution
      # file holds the raw transcript, so put the parts that account for a no-op
      # run on the run page: the tools Claude called, the calls the allowlist
      # denied, and its closing message.
      #
      # Tool *inputs* are summarised, never tool results. Results carry whatever
      # the command printed, and this log is public.
      - name: Report changelog run
        if: always() && steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          exec >> "$GITHUB_STEP_SUMMARY"
          echo '### Changelog run'
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo 'Claude Code produced no execution file.'
            exit 0
          fi

          echo '<details><summary>Tool calls</summary>'
          echo
          echo '```'
          jq -r '.[] | select(.type == "assistant") | .message.content[]?
                 | select(.type == "tool_use")
                 | "\(.name) \(.input | tostring | .[0:200])"' "$EXECUTION_FILE" || echo '(unreadable transcript)'
          echo '```'
          echo '</details>'
          echo

          echo '**Permission denials**'
          echo
          echo '```'
          jq -r '.[] | select(.type == "result") | (.permission_denials // [])[]
                 | "\(.tool_name) \(.tool_input | tostring | .[0:200])"' "$EXECUTION_FILE" || echo '(unreadable transcript)'
          echo '```'
          echo

          echo '**Final message**'
          echo
          echo '```'
          jq -r '[.[] | select(.type == "assistant") | .message.content[]?
                  | select(.type == "text") | .text] | last // "(no closing message)"' "$EXECUTION_FILE" || echo '(unreadable transcript)'
          echo '```'

      # The full transcript, for when the summary above is not enough. Kept as an
      # artifact rather than `show_full_output: true`, which would inline every
      # tool result -- including the whole documentation diff -- into the log.
      - name: Upload changelog transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: changelog-transcript-${{ steps.date.outputs.iso }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Add source links, commit changelog, and push
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: changelogs/${{ steps.date.outputs.yyyy }}/${{ steps.date.outputs.mm }}/changelog-${{ steps.date.outputs.iso }}.md
          HUMAN: ${{ steps.date.outputs.human }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f "$CHANGELOG" ]; then
            echo "Processing changelog: $CHANGELOG"
            uv run add_source_anchors.py "$CHANGELOG"
            git add "$CHANGELOG"
            git commit -m "Add changelog for $HUMAN"
          else
            echo "::warning::Claude did not create $CHANGELOG; pushing documentation update only."
          fi

          # Re-authenticate (claude-code-action revokes its token) and push.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Rebase onto the latest main in case it advanced during this long job.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          # Trigger pages workflow (GITHUB_TOKEN pushes don't trigger other workflows)
          gh workflow run pages.yml
