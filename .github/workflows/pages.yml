name: Build and Deploy Changelog Site

on:
  push:
    branches: [main]
    paths:
      - 'changelogs/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to a full version rather than a major tag: setup-uv stopped
      # publishing moving major/minor tags as of v8, so `@v10` does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          # Dependencies are declared inline (PEP 723), so setup-uv's default
          # glob -- pyproject.toml, uv.lock, requirements.txt -- matches nothing
          # and its cache would never be invalidated. Key it on the scripts that
          # actually carry the dependency block.
          cache-dependency-glob: "site/build_site.py"

      - name: Build site
        run: uv run site/build_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
